name: OTAMA
options:
  bundleIdPrefix: app.otama
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.5.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  OTAMA:
    type: application
    platform: iOS
    sources:
      - path: OTAMA
    info:
      path: OTAMA/Info.plist
      properties:
        CFBundleDisplayName: OTAMA
        CFBundleShortVersionString: "1.5.2"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        # Self-hosted OTAMA servers commonly run over plain HTTP — same
        # parity as Android's usesCleartextTraffic.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.otama.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"

schemes:
  OTAMA:
    build:
      targets:
        OTAMA: [release]
    run:
      config: Release
    archive:
      config: Release

