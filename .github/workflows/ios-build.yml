name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OTAMA.xcodeproj \
            -scheme OTAMA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OTAMA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -40

      - name: Package unsigned IPA
        working-directory: ios/build
        run: |
          mkdir -p Payload
          cp -R OTAMA.xcarchive/Products/Applications/OTAMA.app Payload/
          zip -qry "OTAMA-${GITHUB_REF_NAME#v}.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTAMA-ios-ipa
          path: ios/build/OTAMA-*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/OTAMA-*.ipa
