name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build OTAMA.app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OTAMA.xcodeproj \
            -scheme OTAMA \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            -derivedDataPath build/dd \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee build.log | tail -40

      - name: Diagnostics on failure
        if: failure()
        working-directory: ios
        run: |
          {
            echo "### xcodebuild tail"
            echo '```'
            tail -100 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Commit the log into the repo so it is readable from
          # raw.githubusercontent.com without API access.
          tail -160 build.log > last-build-log.txt 2>/dev/null || echo "(no build.log)" > last-build-log.txt
          git config user.email "ci@otama.local"
          git config user.name "OTAMA CI"
          git add last-build-log.txt
          git commit -m "ci: iOS build log (run ${GITHUB_RUN_ID})" || true
          git push origin HEAD:main || true

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 2 -type d -name "OTAMA.app" -print -quit)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry "OTAMA-${GITHUB_REF_NAME#v}.ipa" Payload

      - name: Generate SHA-256 checksum
        working-directory: ios/build
        run: |
          shasum -a 256 OTAMA-*.ipa > SHA256SUMS-ios.txt
          cat SHA256SUMS-ios.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTAMA-ios-ipa
          path: |
            ios/build/OTAMA-*.ipa
            ios/build/SHA256SUMS-ios.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/build/OTAMA-*.ipa
            ios/build/SHA256SUMS-ios.txt
