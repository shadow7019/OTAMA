name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK for release
        working-directory: android/app/build/outputs/apk/release
        run: cp app-release.apk "OTAMA-${GITHUB_REF_NAME#v}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTAMA-android-apk
          path: android/app/build/outputs/apk/release/OTAMA-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/OTAMA-*.apk
