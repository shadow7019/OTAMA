<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- OTAMA mark v2 — "Ribbon O": black tile, red O with a diagonal ribbon
       fold (the intro-ribbons homage) and a play-triangle core. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6121d"/>
      <stop offset="1" stop-color="#a5060f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#e50914" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <mask id="ringMask">
      <rect width="1024" height="1024" fill="black"/>
      <g transform="rotate(-14 512 512)">
        <circle cx="512" cy="512" r="296" fill="none" stroke="white" stroke-width="118"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <circle cx="512" cy="512" r="430" fill="url(#glow)"/>
  <g transform="rotate(-14 512 512)">
    <circle cx="512" cy="512" r="296" fill="none" stroke="url(#ringGrad)" stroke-width="118"/>
  </g>
  <g mask="url(#ringMask)">
    <g transform="rotate(-14 512 512)">
      <rect x="-200" y="300" width="1424" height="140" fill="#ff4d57" opacity="0.92"/>
      <rect x="-200" y="440" width="1424" height="54" fill="#8f060f" opacity="0.9"/>
    </g>
  </g>
  <path d="M462 398 L672 512 L462 626 Z" fill="#0d0d0d"/>
</svg>
