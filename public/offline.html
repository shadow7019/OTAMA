<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otama — Offline</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #0b0b10; color: #e7e7ea;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  .logo { width: 72px; height: 72px; margin-bottom: 18px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 650; }
  p { margin: 0 0 20px; color: #9a9aa3; max-width: 34em; }
  button {
    background: #5b6cff; color: #fff; border: 0; border-radius: 10px;
    padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4a5cf0; }
</style>
</head>
<body>
<div>
  <img class="logo" src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Streaming needs a connection, so playback is unavailable right now. The app will pick up where you left off as soon as you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</div>
<script>
  addEventListener('online', () => location.reload());
</script>
</body>
</html>
